name: Project self-test

on:
  push:
    branches:
      - main
      - feature/generic-release-support
      - feature/latest-stable-build
      - feature/smart-upgrade-*
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          python -m pip install --requirement requirements-dev.txt

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}"

      - name: Validate GitHub Actions semantics
        run: |
          "$(go env GOPATH)/bin/actionlint" -color

      - name: Validate YAML and Python syntax
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in [*Path(".github/workflows").glob("*.yml"), *Path("config").glob("*.yml")]:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"YAML OK: {path}")
          PY

      - name: Run ShellCheck
        run: |
          shellcheck -x scripts/build-image.sh files/etc/uci-defaults/99-install-thirdparty
          shellcheck -s sh scripts/smart-upgrade-agent.sh scripts/smart-upgrade-storage.sh

      - name: Run unit and future-release fixture tests
        run: pytest -q

      - name: Exercise pinned real apk-tools version semantics
        env:
          ALPINE_ROOTFS_VERSION: "3.22.8"
          ALPINE_ROOTFS_SHA256: "2d7f46af9b7e86ad64ebeba3fe9b75b62dd5b259e708afb2ab21268f627696e5"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/alpine-minirootfs-${ALPINE_ROOTFS_VERSION}-x86_64.tar.gz"
          root="$RUNNER_TEMP/alpine-apk-test"
          curl -fL --retry 3 --proto '=https' -o "$archive" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-${ALPINE_ROOTFS_VERSION}-x86_64.tar.gz"
          printf '%s  %s\n' "$ALPINE_ROOTFS_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$root" "$RUNNER_TEMP/apk-test-bin"
          sudo tar -xzf "$archive" -C "$root"
          printf '#!/usr/bin/env bash\nexec sudo chroot %q /sbin/apk "$@"\n' "$root" > "$RUNNER_TEMP/apk-test-bin/apk"
          chmod +x "$RUNNER_TEMP/apk-test-bin/apk"
          APK_REAL_BINARY="$RUNNER_TEMP/apk-test-bin/apk" \
            pytest -q tests/test_build_evidence.py -k real_apk_tools

      - name: Exercise Analyze and Resolve with fixtures
        run: |
          set -euo pipefail
          python scripts/parse-owut-report.py \
            --report reports/current-system.txt \
            --installed reports/installed-packages.txt \
            --top-level reports/top-level-packages.txt
          python scripts/resolve-packages.py \
            --include-openclash true \
            --include-nikki true \
            --include-lucky true
          grep -q '^unknown-provenance' generated/packages-missing.txt
          grep -q '^openclash:luci-app-openclash$' generated/packages-thirdparty.txt

      - name: Validate official 25.12.2 package indexes
        run: python scripts/validate-manifest.py --version 25.12.2 --online

      - name: Reject a report and requested-version mismatch
        run: |
          set -euo pipefail
          if python scripts/validate-manifest.py --version 29.0.1; then
            echo "mismatched report unexpectedly passed" >&2
            exit 1
          fi

      - name: Confirm strict mode rejects unresolved packages
        run: |
          set -euo pipefail
          if python scripts/validate-manifest.py --version 25.12.2 --strict; then
            echo "strict mode unexpectedly accepted missing top-level provenance" >&2
            exit 1
          fi
          echo "strict mode correctly rejected unknown package provenance"
