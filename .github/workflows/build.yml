name: Build ImmortalWrt x86_64 firmware

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Immutable request identifier
        required: false
        type: string
      snapshot_ref:
        description: Repository evidence directory (evidence/requests/<request-id>)
        required: false
        type: string
      target_version:
        description: Frozen target version (must match build-input-v1.json)
        required: false
        type: string
      strict_mode:
        description: Analysis compatibility flag; false never bypasses the immutable build gate
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: smart-upgrade-${{ inputs.request_id || github.run_id }}
  cancel-in-progress: false

jobs:
  immutable-validate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install verifier dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes jq zstd
          python -m pip install --requirement requirements.txt

      - name: Reject legacy-only or mutable requests
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          [[ -n "$REQUEST_ID" && "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || {
            echo "::error::request_id is required. Legacy reports must first use analyze.yml."; exit 2;
          }
          [[ "$SNAPSHOT_REF" == "evidence/requests/$REQUEST_ID" ]] || {
            echo "::error::snapshot_ref must be the immutable repository path for request_id."; exit 2;
          }
          [[ -n "$TARGET_VERSION" ]] || { echo "::error::target_version is required."; exit 2; }
          [[ -f "$SNAPSHOT_REF/build-input-v1.json" ]] || {
            echo "::error::Missing frozen build-input-v1.json."; exit 2;
          }
          [[ "$(jq -r '.request_id' "$SNAPSHOT_REF/build-input-v1.json")" == "$REQUEST_ID" ]]
          [[ "$(jq -r '.target.version' "$SNAPSHOT_REF/build-input-v1.json")" == "$TARGET_VERSION" ]]

      - name: Install pinned apk-tools comparator
        env:
          ALPINE_ROOTFS_VERSION: "3.22.8"
          ALPINE_ROOTFS_SHA256: "2d7f46af9b7e86ad64ebeba3fe9b75b62dd5b259e708afb2ab21268f627696e5"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/alpine-minirootfs-${ALPINE_ROOTFS_VERSION}-x86_64.tar.gz"
          root="$RUNNER_TEMP/alpine-root"
          curl -fL --retry 3 --proto '=https' \
            -o "$archive" \
            "https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/alpine-minirootfs-${ALPINE_ROOTFS_VERSION}-x86_64.tar.gz"
          printf '%s  %s\n' "$ALPINE_ROOTFS_SHA256" "$archive" | sha256sum -c -
          mkdir -p "$root" "$RUNNER_TEMP/apk-bin" "$RUNNER_TEMP/thirdparty-temp"
          sudo tar -xzf "$archive" -C "$root"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$root/host-apk"
          ln -s "$GITHUB_WORKSPACE/scripts/apk-chroot-wrapper.sh" "$RUNNER_TEMP/apk-bin/apk"
          echo "$RUNNER_TEMP/apk-bin" >> "$GITHUB_PATH"
          echo "APK_CHROOT_ROOT=$root" >> "$GITHUB_ENV"
          echo "APK_CHROOT_ALLOWED_ROOTS=$RUNNER_TEMP/thirdparty-temp:$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/thirdparty-temp" >> "$GITHUB_ENV"
          APK_CHROOT_ROOT="$root" APK_CHROOT_ALLOWED_ROOTS="$RUNNER_TEMP/thirdparty-temp:$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/apk-bin/apk" --version
          [[ "$(APK_CHROOT_ROOT="$root" APK_CHROOT_ALLOWED_ROOTS="$RUNNER_TEMP/thirdparty-temp:$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/apk-bin/apk" version -t 2.0 3.0)" == '<' ]]

      - name: Verify immutable evidence before build
        id: evidence
        env:
          BUILD_INPUT: ${{ inputs.snapshot_ref }}/build-input-v1.json
        run: |
          set -euo pipefail
          python scripts/verify-build-input.py \
            --input "$BUILD_INPUT" --repo-root . \
            --repository "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --stage "$RUNNER_TEMP/preflight" --output generated/verified-build-context.json \
            --offline-recheck
          echo "digest=$(jq -r '.build_input_digest' generated/verified-build-context.json)" >> "$GITHUB_OUTPUT"

      - name: Build from verified immutable bytes
        env:
          BUILD_INPUT: ${{ inputs.snapshot_ref }}/build-input-v1.json
          TRUSTED_REPOSITORY: ${{ github.repository }}
          TRUSTED_COMMIT: ${{ github.sha }}
        run: scripts/build-image.sh

      - name: Validate artifact safety
        id: artifact_safety
        if: always()
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          args=(--path generated/firmware)
          [[ -d "$SNAPSHOT_REF" ]] && args+=(--path "$SNAPSHOT_REF")
          python scripts/validate-artifacts.py "${args[@]}"

      - name: Upload firmware and provenance
        if: ${{ success() && steps.artifact_safety.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: immutable-${{ inputs.request_id }}-${{ steps.evidence.outputs.digest }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            generated/firmware/
            ${{ inputs.snapshot_ref }}/
